<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b3b2b">
<meta name="description" content="Masa 34 Bistro dijital menü ve sipariş. Masanızdan ya da paket servis olarak sipariş verin.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; form-action 'self'; base-uri 'self'">
<title>Masa 34 Bistro — Menü ve Sipariş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== EVREN QR ORDER — ortak stil ===== */
:root{
  --cream:#fbf9f5;--paper:#fff;--forest:#1b3b2b;--forest-2:#24503a;--forest-3:#12281d;
  --terracotta:#d96b27;--terra-d:#b9561a;--text:#1a1a1a;--muted:#6b6b6b;--border:#e8e2d8;
  --danger:#c0392b;--ok:#27ae60;
  --shadow:0 1px 2px rgba(27,59,43,.06),0 6px 20px rgba(27,59,43,.07);
  --shadow-lg:0 18px 50px rgba(18,40,29,.28);
  --radius:16px;--hdr:64px;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--cream);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:3px solid rgba(217,107,39,.55);outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.2em}

.skip-link{position:absolute;left:8px;top:-40px;background:var(--forest);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;z-index:1000;transition:top .2s}
.skip-link:focus{top:8px}

.demo-banner{background:#fff3cd;color:#7a5b00;font-size:12px;text-align:center;padding:7px 12px;border-bottom:1px solid #f1dc8a}
.demo-banner b{color:#5c4300}

.app-header{background:var(--forest);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(18,40,29,.25)}
.app-header-inner{max-width:1100px;margin:0 auto;height:var(--hdr);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.brand-logo{width:40px;height:40px;background:var(--terracotta);border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;letter-spacing:-.02em;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.15;white-space:nowrap}
.brand-sub{font-size:11.5px;opacity:.72;margin-top:1px;white-space:nowrap}
.icon-btn{width:40px;height:40px;background:rgba(255,255,255,.12);border:0;border-radius:50%;color:#fff;display:grid;place-items:center;text-decoration:none;transition:background .2s,transform .15s}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:19px;height:19px}

.chip-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;transition:background .2s,transform .15s}
.chip-btn:hover{background:rgba(255,255,255,.22)}
.chip-btn:active{transform:scale(.96)}
.chip-btn .live{width:8px;height:8px;border-radius:50%;background:#7be0a4;position:relative}
.chip-btn .live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#7be0a4;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.4);opacity:0}}

.btn-primary,.btn-secondary,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;font-size:14px;padding:12px 22px;border:0;transition:transform .15s,background .2s,box-shadow .2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--terracotta);color:#fff;box-shadow:0 4px 14px rgba(217,107,39,.35)}
.btn-primary:hover{background:var(--terra-d)}
.btn-primary:active,.btn-secondary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:#fff;color:var(--forest);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--forest)}
.btn-secondary:disabled{opacity:.55;cursor:not-allowed}
.btn-block{width:100%;padding:14px 22px}

.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--forest);margin:16px 0 6px}
.form-label:first-child{margin-top:0}
.form-label small{font-weight:500;color:var(--muted)}
.form-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--forest);box-shadow:0 0 0 4px rgba(27,59,43,.08)}
.form-input.invalid{border-color:var(--danger);animation:shake .35s}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:6px;font-weight:600}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.toast{position:fixed;top:calc(var(--hdr) + 14px);left:50%;transform:translate(-50%,-24px);background:var(--forest-3);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1);z-index:500;max-width:92vw;text-align:center;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
<style>
body{padding-bottom:130px}

/* ===== HERO ===== */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(110% 130% at 88% 10%,var(--forest-2) 0%,var(--forest) 52%,var(--forest-3) 100%)}
.hero-in{max-width:960px;margin:0 auto;padding:30px 20px 46px;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.85fr);align-items:center;gap:6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8.6vw,58px);line-height:1;letter-spacing:-.035em}
.hero p{margin-top:12px;font-size:15px;line-height:1.45;opacity:.86;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:600}
.chip.table{background:var(--terracotta);box-shadow:0 4px 14px rgba(217,107,39,.4)}
.hero-art svg{display:block;width:100%;height:auto;max-width:300px;margin:0 auto;overflow:visible}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:30px;display:block}
.ly{animation:drop .75s cubic-bezier(.3,1.45,.5,1) both;animation-delay:var(--d)}
@keyframes drop{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.st{animation:steam 3.4s ease-in-out infinite;animation-delay:var(--d);opacity:0}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.75}100%{transform:translateY(-22px);opacity:0}}
.hero-txt>*{animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
.hero-txt h1{animation-delay:.05s}.hero-txt p{animation-delay:.15s}.hero-txt .chips{animation-delay:.25s}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* ===== ARAÇ ÇUBUĞU ===== */
.toolbar{position:sticky;top:var(--hdr);z-index:80;background:var(--cream)}
.toolbar-in{max-width:960px;margin:0 auto;padding:12px 16px 0}
.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:12px 16px 12px 42px;border:1.5px solid var(--border);border-radius:999px;font-size:15px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--forest);box-shadow:0 0 0 4px rgba(27,59,43,.08)}
.cat-nav{position:relative;display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 15px 6px 7px;border:1.5px solid var(--border);background:#fff;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--text);transition:background .2s,color .2s,border-color .2s}
.cat-btn .mini{width:26px;height:26px;border-radius:50%;background:var(--cream);display:grid;place-items:center}
.cat-btn .mini svg{width:19px;height:19px}
.cat-btn.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.cat-btn.active .mini{background:rgba(255,255,255,.92)}

/* ===== MENÜ ===== */
.menu{max-width:960px;margin:0 auto;padding:0 16px}
.sec{scroll-margin-top:calc(var(--hdr) + 118px)}
.sec h2{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.02em;color:var(--forest);margin:24px 0 12px;display:flex;align-items:center;gap:12px}
.sec h2::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--terracotta),rgba(217,107,39,0) 70%);opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px}
.card{display:flex;gap:13px;background:#fff;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .2s}
.card:hover{box-shadow:0 4px 24px rgba(27,59,43,.12)}
.card:active{transform:scale(.99)}
.card.bump{animation:bump .28s ease}
@keyframes bump{40%{transform:scale(1.022)}}

.art{position:relative;width:96px;height:96px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;overflow:hidden;background:var(--cream)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:1}
.art-fb{position:absolute;inset:0;display:grid;place-items:center;z-index:0}
.art-fb svg{width:60px;height:60px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.card:hover .art-fb svg{transform:rotate(-7deg) scale(1.1)}
.tag{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff;color:var(--forest);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tag.hot{background:#c0392b;color:#fff}.tag.veg{background:#2f9e6e;color:#fff}.tag.chef{background:var(--forest);color:#fff}.tag.new{background:var(--terracotta);color:#fff}

.info{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 2px 0 0}
.nm{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.2;letter-spacing:-.01em}
.ds{font-size:12.5px;color:var(--muted);line-height:1.4;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pr{font-family:var(--display);font-weight:800;font-size:17px;color:var(--terracotta)}
.add{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--forest);color:#fff;border:0;font-weight:700;font-size:13px;transition:transform .15s,background .2s}
.add:hover{background:var(--forest-2)}.add:active{transform:scale(.94)}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--cream);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:var(--forest);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .15s}
.qty button:active{transform:scale(.88)}
.qty b{min-width:28px;text-align:center;font-size:14.5px}

.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:19px;color:var(--forest);margin-bottom:4px}

.foot{max-width:960px;margin:34px auto 0;padding:22px 16px 0;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.foot a{color:var(--forest);font-weight:700;text-decoration:none}

/* ===== SEPET ÇUBUĞU ===== */
.cart-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:var(--forest);color:#fff;border-radius:20px;padding:11px 12px 11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow-lg);transform:translateY(150%);transition:transform .4s cubic-bezier(.2,.9,.3,1);z-index:200}
.cart-bar.show{transform:none}
.cb-l{display:flex;align-items:center;gap:12px}
.cb-ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.cb-ic svg{width:22px;height:22px}
.cb-t{display:flex;flex-direction:column;line-height:1.2}
.cb-t span{font-size:12px;opacity:.78}
.cb-t strong{font-family:var(--display);font-size:19px}
.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.14)}}

/* ===== ALT PENCERELER ===== */
.ov{position:fixed;inset:0;background:rgba(10,22,16,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:300}
.ov.show{opacity:1;visibility:visible}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.ov.show .sheet{transform:none}
.sh-head{padding:10px 18px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;gap:12px}
.sh-head::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--border)}
.sh-head h2{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-x{margin-top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--cream);color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.sh-x:hover{background:#efe8db}
.sh-body{padding:4px 18px 14px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sh-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0;background:#fff}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:26px;transform:translateY(24px) scale(.98)}.ov.show .sheet{transform:none}}

/* sepet satırı */
.ci{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:0}
.ci-art{position:relative;width:54px;height:54px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;overflow:hidden;background:var(--cream)}
.ci-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:1}
.ci-art-fb{position:absolute;inset:0;display:grid;place-items:center;z-index:0}
.ci-art-fb svg{width:36px;height:36px}
.ci-info{flex:1;min-width:0}
.ci-n{font-weight:700;font-size:14.5px;line-height:1.25}
.ci-mods{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11.5px;color:var(--muted)}
.ci-mods span{background:var(--cream);padding:1px 7px;border-radius:6px}
.ci-note{margin-top:3px;font-size:11.5px;color:var(--muted);font-style:italic}
.ci-p{font-size:13.5px;color:var(--terracotta);font-weight:700;margin-top:4px}
.ci-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.ci-del{background:none;border:0;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:8px;transition:color .15s,background .15s}
.ci-del:hover{color:var(--danger);background:rgba(192,57,43,.08)}

.empty-cart{text-align:center;padding:48px 16px;color:var(--muted)}
.empty-cart svg{width:56px;height:56px;opacity:.4;margin-bottom:12px}
.empty-cart strong{display:block;font-family:var(--display);font-size:18px;color:var(--forest);margin-bottom:4px}

.totals{padding:4px 0 12px}
.t-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
.t-row.t-total{color:var(--text);font-weight:700;font-size:16px;padding-top:8px;margin-top:6px;border-top:1px dashed var(--border)}
.t-row.t-total strong{font-family:var(--display);font-size:22px;color:var(--terracotta)}

/* sipariş türü */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--cream);border-radius:14px;padding:4px;border:1.5px solid var(--border)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--forest);border-radius:10px;transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.seg[data-v="paket"]::before{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:11px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:color .25s}
.seg button.on{color:#fff}
.gps-btn{width:100%;margin-top:10px}
.gps-res{margin-top:10px;padding:11px 13px;background:rgba(27,59,43,.06);border-radius:12px;font-size:13px;display:none;line-height:1.45}
.gps-res.show{display:block}
.gps-res.err{background:#fdecea;color:var(--danger)}
.gps-res a{color:var(--forest);font-weight:700}
.gps-res button{border:0;background:none;color:var(--danger);font-weight:700;font-size:12.5px;margin-left:8px;text-decoration:underline}
.sum{margin-top:18px;padding:14px;background:var(--cream);border-radius:14px;font-size:13.5px;line-height:1.6;border:1px dashed var(--border)}
.sum strong{color:var(--forest)}
.s-row{display:flex;justify-content:space-between;padding:2px 0}
.s-row.s-total{padding-top:8px;margin-top:6px;border-top:1px dashed var(--border);font-weight:700}
.s-row.s-total strong{font-family:var(--display);font-size:17px;color:var(--terracotta)}
.s-where{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);color:var(--muted);font-size:13px}
.btn-row{display:flex;gap:10px}
.btn-row .btn-secondary{flex:0 0 auto}
.btn-row .btn-primary{flex:1}

.pii-note{margin-top:16px;padding:11px 13px;background:rgba(27,59,43,.05);border-radius:10px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.link-btn{background:none;border:0;color:var(--forest);font-weight:700;text-decoration:underline;padding:0;margin-left:4px;font-size:inherit}

/* takip */
.okc{width:64px;height:64px;display:block;margin:6px auto 10px}
.okc circle,.okc path{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s .1s ease forwards}
.okc path{animation-delay:.55s;animation-duration:.45s}
.okc.cancel circle,.okc.cancel path{stroke:#95a5a6}
@keyframes draw{to{stroke-dashoffset:0}}
.tr-t{text-align:center;font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.02em}
.tr-s{text-align:center;color:var(--muted);font-size:13.5
